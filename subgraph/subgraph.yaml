specVersion: 1.0.0
description: DeFiHub Option A protocol subgraph.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: PoolFactory
    network: arbitrum-sepolia
    source:
      address: "0xd51207288c2B803A3d365a04Bb7C316072a4a3FA"
      abi: PoolFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
      abis:
        - name: PoolFactory
          file: ./abis/PoolFactory.json
      eventHandlers:
        - event: PoolCreated(indexed address,indexed address,indexed address,bytes32)
          handler: handlePoolCreated
      file: ./src/mappings.ts
  - kind: ethereum/contract
    name: AMMPool
    network: arbitrum-sepolia
    source:
      address: "0x03b1882CE3EB333A29806c66acD24AaeB7F8eC7B"
      abi: AMMPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - LiquidityEvent
        - Swap
      abis:
        - name: AMMPool
          file: ./abis/AMMPool.json
      eventHandlers:
        - event: Mint(indexed address,uint256,uint256,uint256)
          handler: handleMint
        - event: Burn(indexed address,uint256,uint256,uint256)
          handler: handleBurn
        - event: Swap(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleSwap
      file: ./src/mappings.ts
  - kind: ethereum/contract
    name: YieldVault
    network: arbitrum-sepolia
    source:
      address: "0x1F248BF5FFa817d5658253AF86ffCFB8e6710715"
      abi: YieldVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - VaultAccount
        - VaultAction
      abis:
        - name: YieldVault
          file: ./abis/YieldVault.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleVaultDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleVaultWithdraw
      file: ./src/mappings.ts
  - kind: ethereum/contract
    name: LendingPool
    network: arbitrum-sepolia
    source:
      address: "0x89e6a15EA06342622b9cff3Ee5F1C1ed9a7102F9"
      abi: LendingPool
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - LoanPosition
        - LoanAction
      abis:
        - name: LendingPool
          file: ./abis/LendingPool.json
      eventHandlers:
        - event: CollateralDeposited(indexed address,uint256)
          handler: handleCollateralDeposited
        - event: CollateralWithdrawn(indexed address,uint256)
          handler: handleCollateralWithdrawn
        - event: Borrowed(indexed address,uint256,uint256)
          handler: handleBorrowed
        - event: Repaid(indexed address,uint256,uint256)
          handler: handleRepaid
        - event: Liquidated(indexed address,indexed address,uint256,uint256)
          handler: handleLiquidated
      file: ./src/mappings.ts
